name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          npm init -y
          npm i three@0.160.0 @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www/lib
          cp node_modules/three/build/three.module.js www/lib/
          cp -r node_modules/three/examples/jsm www/lib/jsm
          cp jiggle-apk.html www/index.html
          npx cap init Jiggle com.jiggle.app --web-dir www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jiggle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
